<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Special Modes · Flying Eyeball</title>
    <script>
        const base = document.createElement('base');
        base.href = location.pathname.replace(/[^/]+\/?$/, '');
        document.head.appendChild(base);
    </script>
    <link rel="icon" href="art/Favicon.png">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f0f7ff; color: #172554; font-family: ui-rounded, system-ui, sans-serif; }
        main { max-width: 720px; margin: auto; padding: 36px 20px max(36px, env(safe-area-inset-bottom)); }
        header { text-align: center; margin-bottom: 26px; }
        .eyebrow { margin: 0 0 8px; color: #3b82f6; font-size: 12px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
        h1 { margin: 0; font-size: clamp(30px, 7vw, 44px); letter-spacing: -.04em; }
        header p:last-child { color: #64748b; margin: 10px 0 0; }
        .modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
        .mode { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: inherit;
            background: white; border: 1px solid #dbeafe; border-radius: 26px; padding: 16px 8px 20px;
            box-shadow: 0 5px 0 #dbeafe; transition: transform .15s, box-shadow .15s; }
        .mode:hover { transform: translateY(-3px); box-shadow: 0 8px 0 #bfdbfe; }
        .mode:active { transform: translateY(3px); box-shadow: 0 2px 0 #bfdbfe; }
        .mode:focus-visible { outline: 4px solid #60a5fa; outline-offset: 4px; }
        .classic { grid-column: 1 / -1; background: linear-gradient(135deg, #fff, #e0f2fe); }
        .classic canvas { width: 230px; height: 140px; max-width: 100%; }
        .portrait { position: relative; height: 155px; width: 100%; display: grid; place-items: center; }
        .portrait img { position: relative; max-width: 90%; width: 124px; height: 148px; object-fit: contain; filter: drop-shadow(0 6px 5px #1e3a8a15); }
        .mode strong { font-size: 20px; letter-spacing: -.02em; margin-top: 8px; }
        .play { font-size: 12px; color: #2563eb; margin-top: 6px; font-weight: 700; }
        .classic strong { font-size: 24px; }
        footer { text-align: center; margin-top: 28px; color: #64748b; font-size: 12px; line-height: 1.6; }
        @media (prefers-reduced-motion: reduce) { .mode { transition: none; } }
    </style>
</head>
<body>
<main>
    <header><p class="eyebrow">Flying Eyeball</p><h1>Choose your wings.</h1><p>Pick a face. Catch some fruit.</p></header>
    <nav class="modes" id="mode-picker" aria-label="Choose a game mode">
        <a class="mode classic" href="Eyeball" aria-label="Play Eyeball">
            <canvas id="eyeball-preview" width="460" height="280" aria-hidden="true"></canvas>
            <strong>Eyeball</strong><span class="play">Play the original →</span>
        </a>
    </nav>
    <footer>Every face has its own leaderboard.<br>A great run can make the main leaderboard too.</footer>
</main>
<script type="module" src="src/special.js?v=13"></script>
</body>
</html>
